<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | Admin Dashboard</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3.2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-main d-flex align-items-center justify-content-center vh-100">

    <div class="text-center px-4">
        <h1 class="display-1 fw-bold text-primary mb-0">404</h1>
        <h2 class="fw-bold mb-3">Oops! Page Not Found</h2>
        <p class="text-muted mb-4 fs-5">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>

        <div class="mb-5">
            <img src="https://illustrations.popsy.co/slate/falling.svg" alt="404 Illustration" style="max-width: 300px; height: auto;">
        </div>

        <a href="index.html" class="btn btn-primary px-5 py-2 fw-bold">
            <i class="bi bi-house-door me-2"></i> Return to Dashboard
        </a>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
