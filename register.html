<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Admin Dashboard</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3.2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="auth-wrapper">

    <div class="card auth-card shadow-lg border-0">
        <div class="text-center mb-4">
            <h3 class="fw-bold">Admin<span class="text-primary">Pro</span></h3>
            <p class="text-muted">Create your free account</p>
        </div>

        <form>
            <div class="mb-3">
                <label class="form-label small fw-bold">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control bg-light border-start-0" placeholder="John Doe" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control bg-light border-start-0" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control bg-light border-start-0" placeholder="••••••••" required>
                    <button class="btn btn-light border border-start-0 password-toggle" type="button">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="terms">
                <label class="form-check-label small" for="terms">I agree to the <a href="#" class="text-decoration-none">Terms & Conditions</a></label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3" onclick="window.location.href='index.html'; return false;">
                Create Account
            </button>

            <div class="text-center mb-3">
                <span class="small text-muted">Or register with</span>
            </div>

            <div class="row g-2 mb-4">
                <div class="col-6">
                    <button type="button" class="btn btn-outline-light border w-100 text-body small">
                        <i class="bi bi-google me-2 text-danger"></i> Google
                    </button>
                </div>
                <div class="col-6">
                    <button type="button" class="btn btn-outline-light border w-100 text-body small">
                        <i class="bi bi-github me-2"></i> GitHub
                    </button>
                </div>
            </div>

            <p class="text-center small mb-0">
                Already have an account? <a href="login.html" class="text-decoration-none fw-bold">Sign In</a>
            </p>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
